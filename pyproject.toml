[project]
name = "rag-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Seiflegnioui", email = "eddseif003@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "faiss-cpu>=1.16.0",
    "fastapi>=0.115.0",
    "langchain>=1.5.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.8.0",
    "langchain-text-splitters>=0.3.0",
    "pymupdf>=2.1",
    "pypdf>=7.1.0",
    "sentence-transformers>=6.3.0",
    "uvicorn>=0.34.0",
]

[project.scripts]
rag-course = "rag_course:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
